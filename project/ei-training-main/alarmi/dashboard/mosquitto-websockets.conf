# Mosquitto 설정 - MQTT(보드용) + WebSocket(브라우저용)
#
# 이 파일을 C:\Program Files\mosquitto\mosquitto.conf 에 덮어쓰거나
# 아래 명령으로 이 파일을 직접 지정해서 실행한다 (관리자 PowerShell):
#
#   net stop mosquitto
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c "<이 파일 경로>" -v
#
# Mosquitto 2.x 는 리스너를 명시하지 않으면 localhost 에만 바인딩한다.
# 그래서 보드(다른 기기)에서 붙으려면 0.0.0.0 으로 열어줘야 한다.

# ---- 보드(ESP32)가 붙는 일반 MQTT 포트 ----
listener 1883 0.0.0.0
protocol mqtt

# ---- 브라우저(HTML 대시보드)가 붙는 WebSocket 포트 ----
# 브라우저는 raw TCP 소켓을 못 열어서 MQTT 를 WebSocket 위에 얹어야 한다.
listener 9001 0.0.0.0
protocol websockets

# 수업용이라 인증 없이 연다. 외부에 노출되는 망이면 절대 쓰지 말 것.
allow_anonymous true

# 로그는 파일로 남긴다.
# 주의: Windows 서비스로 돌 때는 stdout 이 없어서 log_dest stdout 을 쓰면
# 브로커가 시작하자마자 죽는다. 반드시 파일로 지정할 것.
log_dest file C:\ProgramData\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
